name: 🚀 Sprawdź ceny (Szybko - Bez API)

on:
  schedule:
    # Uruchamia się o równej godzinie przez cały dzień Z WYJĄTKIEM 8:00 i 20:00 (kiedy działa pełna akcja)
    - cron: '0 0-7,9-19,21-23 * * *'
  # Możliwość ręcznego uruchomienia z zakładki Actions
  workflow_dispatch:

jobs:
  check-prices-fast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaluj zależności
        run: npm ci

      - name: Sprawdź ceny produktów (Szybki tryb)
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # BRAK SECRETU SCRAPER_API_KEY - zablokowane strony zostaną pominięte bez użycia API
        run: npm run check
